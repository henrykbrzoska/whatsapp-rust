[package]
name = "ngwhatsapp"
description = "Tauri 2 shell for the ngWhatsapp client (engine runs as a sidecar)"
version = "0.1.0"
authors = ["Henryk Brzoska"]
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"

# Standalone crate — not a member of the engine workspace.
[workspace]

[lib]
name = "ngwhatsapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util"] }
# Plain HTTP to the localhost sidecar only (`export_chat_history`) — no TLS features.
reqwest = { version = "0.13", default-features = false }
