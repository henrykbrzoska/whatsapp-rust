[workspace]
members = [
    "crates/wa-proto",
    "crates/wa-core",
    "crates/wa-store",
    "crates/bebok-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Henryk Brzoska"]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rand = "0.8"
curve25519-dalek = "4"
sha2 = "0.10"
hex = "0.4"
lru = "0.12"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "gzip"] }
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
specta = { version = "1.0.5", features = ["export", "typescript"] }

wa-proto = { path = "crates/wa-proto" }
wa-core = { path = "crates/wa-core" }
wa-store = { path = "crates/wa-store" }

[profile.test]
debug = "line-tables-only"
