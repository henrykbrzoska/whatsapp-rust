[package]
name = "bebok-server"
default-run = "bebok-server"
description = "HTTP + SSE engine for the ngWhatsapp client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bebok-server"
path = "src/main.rs"

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"

[features]
default = []
fastembed = ["wa-store/fastembed"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
dirs = "6"
futures.workspace = true
rand.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wa-store.workspace = true
wa-core.workspace = true
specta.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util = "0.1"
tempfile.workspace = true
# Building a `waE2E.Message` payload for the stored-kind repair tests.
prost.workspace = true
wa-proto.workspace = true
